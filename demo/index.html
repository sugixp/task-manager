<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Static demo of Task Manager, a Python/Flask task manager.">
  <title>Task Manager · Demo</title>
  <!-- style.css is copied from task_manager/web/static/ by scripts/build_demo.py -->
  <link rel="stylesheet" href="style.css">
  <script src="demo.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="app-header">
      <h1><a href="#all">Task Manager</a></h1>
      <div id="progress">
        <p class="progress-label" id="progress-label"></p>
        <div class="progress" aria-hidden="true">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>
    </header>

    <div id="alerts"></div>

    <section id="list-view">
      <form class="card add-form" id="add-form" novalidate>
        <label class="visually-hidden" for="title">Task title</label>
        <input id="title" name="title" maxlength="200"
               placeholder="What needs to be done?" autocomplete="off">
        <label class="visually-hidden" for="priority">Priority</label>
        <select id="priority" name="priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <button type="submit" class="btn btn-primary">Add task</button>
        <p id="add-error" class="field-error" hidden></p>
      </form>

      <nav class="filters" aria-label="Filter tasks by status">
        <a href="#all" class="filter" data-status="all">All <span class="count"></span></a>
        <a href="#pending" class="filter" data-status="pending">Pending <span class="count"></span></a>
        <a href="#done" class="filter" data-status="done">Done <span class="count"></span></a>
      </nav>

      <ul class="card task-list" id="task-list"></ul>

      <div class="card empty-state" id="empty-state" hidden>
        <p class="empty-title" id="empty-title"></p>
        <p class="empty-text" id="empty-text"></p>
      </div>
    </section>

    <form class="card edit-form" id="edit-form" novalidate hidden>
      <h2>Edit task</h2>
      <p id="edit-error" class="field-error" hidden></p>

      <label for="edit-title">Title</label>
      <input id="edit-title" name="title" maxlength="200">

      <label for="edit-priority">Priority</label>
      <select id="edit-priority" name="priority">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="edit-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save changes</button>
      </div>
    </form>

    <p class="note">
      Static demo: your tasks are saved only in this browser.
      The real app is built with Python and Flask —
      <a href="https://github.com/sugixp/task-manager">view source on GitHub</a>.
      <button type="button" class="link-button" id="reset-demo">Reset demo data</button>
    </p>
  </main>
</body>
</html>
